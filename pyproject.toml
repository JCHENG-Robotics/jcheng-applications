[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jcheng-applications"
version = "0.1.0"
description = "Offline task orchestration core for the JCHENG Robotics ecosystem"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
test = ["pytest>=7.4,<9"]
# Optional M1.5 tree engine. Not the default; the license review is open.
tree = ["py_trees==2.6.0", "pydot==4.0.1", "pyparsing==3.3.3"]

[project.scripts]
jcheng-applications = "jcheng_applications.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
