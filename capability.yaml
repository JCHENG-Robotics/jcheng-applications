# Capability manifest for the organization's admission check.
# jcheng-applications is an L4 task-orchestration application
# (JCHENG-Robotics/.github docs/repo-taxonomy.md, layer L4).
#
# M3 is a supervised execution client: it acquires a system lease and submits
# MotionCommands to the jcheng-system gateway over HTTP. It is a gateway intent
# source, not a DDS publisher: the runtime surface stays empty, it joins no ROS
# domain, opens no device and never executes motion itself. The system layer
# remains the only origin of motion and owns the lease, deadman, limits and
# stop latch.
#
# The class moves from offline to motion_source because an authorized session
# can now cause a motion intent through the gateway. The scopes are exactly the
# recipe scopes the repository ships; a recipe with another scope is refused by
# the preflight before submission.
schema_version: 1
name: jcheng-applications
version: 0.1.0
contract:
  interfaces: ">=0.2,<0.3"
  contract_hash: "sha256:afca22a42f7163e0351d185d5a8577b0b51f2f3da4b92278f161a4a7d2c35b1c"
  system_api: ">=0.1,<0.2"
safety:
  class: motion_source
  scopes: [arm, gripper]
  # Binding at M3: the run acquires a lease before the first submission and
  # releases it on every terminal path.
  requires_lease: true
  max_rate_hz: 1
  deadman_ms: 500
hardware_access: none
runtime:
  ros_domains: []
  publishes: []
  subscribes: []
